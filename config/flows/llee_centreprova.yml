name: llee_centreprova
source:
  type: xlsx
  path: llee_mensual.xlsx
  sheet: LLEE per Centre i Prova
  header_row: 1
processing:
  drop_empty_rows: true
  drop_empty_columns: true
  trim_strings: all
validation:
  required_columns:
    - any
    - mes
    - Centre
    - Proves
    - Prestacions
    - Pendents de programar
    - % pendents programar
    - Mes de 90 dies
    - % mes 90 dies
    - Entrades
    - Sortides
    - Diferència Entrades-Sortides
    - Temps de demora (dies)
    - Temps d'espera (dies)
    - TD/TE (%)
  missing_columns_policy: error
  duplicate_key:
    - any
    - mes
    - Centre
    - Proves
  duplicate_policy: report
output:
  processed_filename: llee_centreprova_processed.csv
  report_filename: llee_centreprova_report.json
